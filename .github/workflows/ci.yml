name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run ci

  package-windows:
    name: package-windows
    needs: test
    if: ${{ needs.test.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate integrity manifest
        run: npm run integrity:manifest
      - name: Build unsigned smoke installer
        run: npm run dist:win:unsigned
      - name: Verify smoke artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath dist -Filter 'Aegis-Guard-Setup-*-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'The Windows smoke installer was not produced.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'NotSigned') { throw "The CI smoke installer must be unsigned; status was $($signature.Status)." }
          Write-Host "Smoke installer: $($installer.FullName) ($($installer.Length) bytes)"
